<style>
:root{--bg:#fafafa;--ink:#111;--sub:#555;--line:#e5e5e5;--chip:#efefef;--blue:#1868db;
--mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
--sans:'Inter','Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
--serif:'Instrument Serif',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1420px;margin:0 auto;padding:0 48px}
.top{position:sticky;top:0;z-index:50;background:rgba(250,250,250,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);height:69px}
.top .wrap{height:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.brand{font-weight:600;font-size:18px;letter-spacing:-.01em;text-decoration:none}
.top nav{display:flex;gap:28px}.top nav a{text-decoration:none;color:var(--sub);font-size:16px}.top nav a:hover{color:var(--ink)}
.eyebrow{font:12.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
.herob{position:relative;overflow:hidden}#waves{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.herob .hero{position:relative}
.hero{padding-top:120px;padding-bottom:104px}
h1{font-weight:300;font-size:clamp(40px,5.6vw,80px);line-height:1.03;letter-spacing:-.05em;margin:34px 0 0;max-width:1180px}
h1 em,h2 em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.02em}
section.s{border-top:1px solid var(--line);padding:64px 0 72px;scroll-margin-top:69px}
.sh{display:grid;grid-template-columns:minmax(0,.79fr) minmax(0,1fr);gap:48px;align-items:start;margin-bottom:28px}
.num{font:13px var(--mono);letter-spacing:.1em;color:var(--sub);margin-bottom:6px}
h2{font-weight:400;font-size:clamp(32px,3.4vw,48px);line-height:1.05;letter-spacing:-.045em;margin:0}
.secsub{margin:10px 0 0;color:var(--sub);font-size:17px;line-height:1.5;max-width:760px}
.grid{display:grid;gap:64px 40px}.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr));gap:56px 24px}
.tag{display:inline-block;font:11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;background:var(--chip);color:#555;padding:4px 9px;border-radius:5px;margin-bottom:12px}
.cardhead{margin-bottom:16px}
.cardtitle{font-weight:500;font-size:19px;margin:0 0 2px;letter-spacing:-.01em}
.live{position:relative;aspect-ratio:1280/800;overflow:hidden;background:#0b0b0c;border-radius:16px;clip-path:inset(0 round 16px);border:1px solid var(--line);box-shadow:0 18px 50px -28px rgba(20,25,40,.35)}
.live iframe{position:absolute;left:0;top:0;width:1280px;height:800px;border:0;transform-origin:0 0;background:#0b0b0c}
.live .ph{position:absolute;inset:0;display:grid;place-items:center;color:#8a8a8a;font:13px var(--mono);pointer-events:none}
.empty .live{background:transparent;border:1.5px dashed #cfcfcf;box-shadow:none}.empty .ph{color:#9a9a9a}.empty .cardtitle{color:#9a9a9a}
@media(max-width:900px){.grid.c2,.grid.c3{grid-template-columns:1fr}.wrap{padding:0 24px}}
</style></head>

:0}to{width:100%}}\n<\/style><\/head><body>\n<canvas id=\"c\"><\/canvas><div class=\"vig\"><\/div>\n<div class=\"bar\"><i><\/i><\/div>\n<script>\n// ---- timeline (seconds) ----\nconst T_SHRINK=[0.30,0.85];       // big logo shrinks down to frame size\nconst T_REVEAL=[0.45,0.90];       // the short strip opens out from the centre\nconst T_NUDGE =[0.85,1.15];       // small nudge left\nconst T_SWIPE =[1.20,2.45];       // swipe right, flutter through lots of frames\nconst T_GROW  =[2.80,3.25];       // centre frame blooms back to full size\nconst T_FADE  =[2.85,3.20];       // strip fades away\nconst LOOP=4.15;\nconst K=15;                       // frames flown past during the swipe\n// ---- layout (px in a 1280x800 frame) ----\nconst PITCH=120, CELL_W=104, CELL_H=92, BAND_H=128, SMALL=0.40;\nconst WINDOW=2.0*PITCH, CURVE=1.8;   // 3 frames visible; opacity: 1 at centre, ~0.3 one frame out, 0 at the ends\n// ----------------------------\nconst cv=document.getElementById('c'), ctx=cv.getContext('2d');\nconst W=innerWidth,H=innerHeight,DPR=2; cv.width=W*DPR; cv.height=H*DPR;\nconst CX=W/2, CY=H*0.42, S=Math.min(W,H)/260*0.4*0.75;   // big logo height matches cards 1\u20133\nconst cl=x=>Math.min(1,Math.max(0,x)), ph=(r,t)=>cl((t-r[0])/(r[1]-r[0]));\nconst eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eo=x=>1-Math.pow(1-x,3);\nconst hash=(n,s)=>{const v=Math.sin(n*127.1+s*311.7)*43758.5453;return v-Math.floor(v)};\nconst spokes=new Path2D(), ring=new Path2D();\nfor(let i=0;i<12;i++){const r=new Path2D();r.rect(-12,-100,24,60);spokes.addPath(r,new DOMMatrix().rotate(i*30))}\nring.arc(0,0,44,0,Math.PI*2);ring.arc(0,0,34,0,Math.PI*2,true);\n// cubic-bezier easing (like CSS): the swipe eases in briefly, then slows over a long, soft tail\nfunction cubicBezier(x1,y1,x2,y2){\n  const bx=t=>3*x1*(1-t)*(1-t)*t+3*x2*(1-t)*t*t+t*t*t, by=t=>3*y1*(1-t)*(1-t)*t+3*y2*(1-t)*t*t+t*t*t;\n  const dx=t=>3*x1*(1-t)*(1-t)+6*(x2-x1)*(1-t)*t+3*(1-x2)*t*t;\n  return x=>{x=Math.min(1,Math.max(0,x));let t=x;for(let i=0;i<8;i++){const d=dx(t);if(Math.abs(d)<1e-6)break;t-=(bx(t)-x)/d}return by(Math.min(1,Math.max(0,t)))};\n}\nconst swipeEase=cubicBezier(0.5,0,0.1,1);\nfunction off(t){\n  const n=eo(ph(T_NUDGE,t)), s=swipeEase(ph(T_SWIPE,t));\n  return -0.32*PITCH*n+(K*PITCH+0.32*PITCH)*s;\n}\nfunction rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}\nfunction drawFrame(x,y,alpha,logoScale,cellAlpha){\n  ctx.save();ctx.translate(x,y);\n  if(cellAlpha>0.003){\n    ctx.globalAlpha=alpha*cellAlpha;\n    rr(-CELL_W/2,-CELL_H/2,CELL_W,CELL_H,7);ctx.fillStyle='#17171a';ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='#2b2b30';ctx.stroke();\n  }\n  ctx.globalAlpha=alpha;ctx.fillStyle='#fff';\n  ctx.scale(S*logoScale,S*logoScale);ctx.fill(spokes);ctx.fill(ring,'evenodd');\n  ctx.restore();\n}\nconst FIX=new URLSearchParams(location.search).get('t');\nfunction frame(ms){\n  if(FIX!==null) ms=+FIX*1000;\n  const t=(ms/1000)%LOOP, o=off(t), dt=0.008, v=(off(t+dt)-off(t-dt))/(2*dt);\n  const flutter=cl(Math.abs(v)/(PITCH*16)), blur=Math.abs(v)/24;\n  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);\n  const shrink=eio(ph(T_SHRINK,t)), grow=eio(ph(T_GROW,t));\n  const heroScale=1-(1-SMALL)*shrink+(1-SMALL)*grow;\n  const reveal=eio(ph(T_REVEAL,t)), fade=ph(T_FADE,t);\n  const stripA=reveal>0?(1-eio(fade)):0;\n  const heroN=o>800?-K:0;\n  const hw=WINDOW*reveal, edgeAt=x=>Math.pow(cl(1-Math.abs(x-CX)/Math.max(hw,1)),CURVE);\n  if(stripA>0.003&&hw>2){\n    const grad=(rgb)=>{const g=ctx.createLinearGradient(CX-hw,0,CX+hw,0);for(let i=0;i<=16;i++){const d=Math.abs(i/16-0.5)*2;g.addColorStop(i/16,'rgba('+rgb+','+Math.pow(1-d,CURVE)+')')}return g};\n    ctx.globalAlpha=stripA;\n    ctx.fillStyle=grad('17,17,19');ctx.fillRect(CX-hw,CY-BAND_H/2,hw*2,BAND_H);\n    ctx.fillStyle=grad('38,38,43');ctx.fillRect(CX-hw,CY-BAND_H/2,hw*2,1);ctx.fillRect(CX-hw,CY+BAND_H/2-1,hw*2,1);\n    const sp=PITCH/4, s0=Math.floor((-hw-o)/sp)-1, s1=Math.ceil((hw-o)/sp)+1;\n    for(let i=s0;i<=s1;i++){\n      const x=CX+i*sp+o, a=stripA*edgeAt(x); if(a<0.01)continue;\n      ctx.globalAlpha=a;ctx.fillStyle='#0a0a0c';\n      rr(x-5,CY-BAND_H/2+9,10,7,2);ctx.fill();rr(x-5,CY+BAND_H/2-16,10,7,2);ctx.fill();\n    }\n    ctx.globalAlpha=1;\n  }\n  const n0=Math.floor((-CX-o)/PITCH)-1, n1=Math.ceil((W-CX-o)/PITCH)+1;\n  const samples=blur>3?5:1;\n  for(let n=n0;n<=n1;n++){\n    const x0=CX+n*PITCH+o, hero=(n===heroN);\n    if(!hero&&stripA<=0.003)continue;\n    const edge=edgeAt(x0), big=(heroScale-SMALL)/(1-SMALL);\n    const a=hero?Math.max(edge,cl(big*4)):stripA*edge*(1-0.3*flutter*hash(n,3));\n    if(a<=0.003)continue;\n    const cellA=hero?stripA*edge:1;\n    for(let j=0;j<samples;j++){\n      const dx=samples>1?(j/(samples-1)-0.5)*blur:0;\n      drawFrame(x0+dx,CY,samples>1?a*0.42:a,hero?heroScale:SMALL,cellA);\n    }\n  }\n  ctx.globalAlpha=1;\n  requestAnimationFrame(frame);\n}\nrequestAnimationFrame(frame);\n<\/script><\/body><\/html>\n", "items/dof.html": "<!doctype html><html><head><meta charset=\"utf-8\"><title>Depth of field<\/title>\n<style>html,body{margin:0;height:100%;background:#0b0b0c;overflow:hidden}#a{position:absolute;inset:0 0 auto 0;height:84%;display:grid;place-items:center}#a svg{height:66%!important;width:auto!important;overflow:visible!important}\n.bar{position:absolute;left:50%;top:73.5%;width:58vh;height:2vh;min-height:3px;transform:translateX(-50%);background:#1e1e20;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#1b6ae0;animation:load 5s linear infinite}@keyframes load{from{width:0}to{width:100%}}<\/style><\/head>\n<body><div id=\"a\"><\/div><div class=\"bar\"><i><\/i><\/div>\n<script>(function(){var s=document.createElement('script');s.textContent=parent.__PLAYER['lottie.min.js'];document.head.appendChild(s)})()<\/script><script>window.LOADER_GZ=\"H4sIAAAAAAAC/+VZy26jMBT9FeS1QcY8k91UrWYzi1FnOcqCNk7iKQGE3Zcq/n2uzTukraYxixFKU4Lte47v8eEakjf0hNYocCLHRxjtSrQOCUa8QGs45HCgQYzRMzTH0HBAa1/1Z0cIumaFPFj5ztpxlm4hervd6rBE _rot; uniform float u_s; uniform vec2 u_half; uniform float u_off;\nvarying vec3 v_n;\nvoid main(){\n  vec3 p=u_rot*a_pos*u_s;           // CSS-style coords: +x right, +y down, +z toward viewer\n  float D=900.0, n=100.0, f=4000.0;\n  float w=D-p.z, ez=p.z-D;\n  float A=-(f+n)/(f-n), B=-2.0*f*n/(f-n);\n  gl_Position=vec4(D*p.x/u_half.x, -D*p.y/u_half.y+u_off*w, A*ez+B, w);\n  v_n=u_rot*a_nrm;\n}`));\ngl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`\nprecision mediump float; varying vec3 v_n; uniform vec3 u_light;\nvoid main(){ float k=0.55+0.5*max(0.0,dot(normalize(v_n),u_light)); gl_FragColor=vec4(vec3(min(1.0,k)),1.0); }`));\ngl.linkProgram(pr); gl.useProgram(pr);\n// ---- geometry: 12 box spokes + a round ring, depth-buffered so there are no seams ----\nconst P=[],N=[];\nconst tri=(a,b,c,n)=>{for(const v of [a,b,c]){P.push(...v);N.push(...n)}};\nfunction quad(a,b,c,d,n){tri(a,b,c,n);tri(a,c,d,n)}\nconst rz=(v,a)=>[v[0]*Math.cos(a)-v[1]*Math.sin(a),v[0]*Math.sin(a)+v[1]*Math.cos(a),v[2]];\nconst hd=DEPTH/2, SI=INNER+RING-4, W_=WIDTH, hw=W_/2;\nfor(let i=0;i<SPOKES;i++){\n  const a=i*2*Math.PI/SPOKES;\n  const c=(x,y,z)=>rz([x,y,z],a), nn=(x,y,z)=>rz([x,y,z],a);\n  const y0=-OUTER, y1=-SI;\n  quad(c(-hw,y0,hd),c(hw,y0,hd),c(hw,y1,hd),c(-hw,y1,hd),nn(0,0,1));\n  quad(c(hw,y0,-hd),c(-hw,y0,-hd),c(-hw,y1,-hd),c(hw,y1,-hd),nn(0,0,-1));\n  quad(c(hw,y0,hd),c(hw,y0,-hd),c(hw,y1,-hd),c(hw,y1,hd),nn(1,0,0));\n  quad(c(-hw,y0,-hd),c(-hw,y0,hd),c(-hw,y1,hd),c(-hw,y1,-hd),nn(-1,0,0));\n  quad(c(-hw,y0,-hd),c(hw,y0,-hd),c(hw,y0,hd),c(-hw,y0,hd),nn(0,-1,0));\n  quad(c(-hw,y1,hd),c(hw,y1,hd),c(hw,y1,-hd),c(-hw,y1,-hd),nn(0,1,0));\n}\nconst Ri=INNER, Ro=INNER+RING, hr=hd-0.6;      // ring recessed a hair so spoke faces sit cleanly on top\nfunction pt(r,k,z){const t=k*2*Math.PI/FACETS;return [r*Math.sin(t),-r*Math.cos(t),z]}\nfunction rad(k,s){const t=k*2*Math.PI/FACETS;return [s*Math.sin(t),-s*Math.cos(t),0]}\nfunction quadSmooth(a,b,c,d,na,nb,nc,nd){for(const [v,n] of [[a,na],[b,nb],[c,nc],[a,na],[c,nc],[d,nd]]){P.push(...v);N.push(...n)}}\nfor(let k=0;k<FACETS;k++){\n  const k1=k+1;\n  quad(pt(Ri,k,hr),pt(Ro,k,hr),pt(Ro,k1,hr),pt(Ri,k1,hr),[0,0,1]);\n  quad(pt(Ro,k,-hr),pt(Ri,k,-hr),pt(Ri,k1,-hr),pt(Ro,k1,-hr),[0,0,-1]);\n  quadSmooth(pt(Ri,k,-hr),pt(Ri,k1,-hr),pt(Ri,k1,hr),pt(Ri,k,hr),rad(k,-1),rad(k1,-1),rad(k1,-1),rad(k,-1));\n  quadSmooth(pt(Ro,k,hr),pt(Ro,k1,hr),pt(Ro,k1,-hr),pt(Ro,k,-hr),rad(k,1),rad(k1,1),rad(k1,1),rad(k,1));\n}\nconst buf=(data,name,size)=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);\n  const l=gl.getAttribLocation(pr,name);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,size,gl.FLOAT,false,0,0)};\nbuf(P,'a_pos',3); buf(N,'a_nrm',3);\nconst COUNT=P.length/3;\nconst U=n=>gl.getUniformLocation(pr,n);\ngl.uniform2f(U('u_half'),W/2,H/2);\ngl.uniform1f(U('u_s'),Math.min(W,H)/260*0.4*SIZE);\ngl.uniform1f(U('u_off'),0.16);\nconst L=Math.hypot(...LIGHT); gl.uniform3f(U('u_light'),LIGHT[0]/L,LIGHT[1]/L,LIGHT[2]/L);\ngl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);\ngl.viewport(0,0,cv.width,cv.height);\ngl.clearColor(10/255,10/255,13/255,1);\nfunction mul(a,b){const o=new Array(9).fill(0);for(let c=0;c<3;c++)for(let r=0;r<3;r++)for(let k=0;k<3;k++)o[c*3+r]+=a[k*3+r]*b[c*3+k];return o}\nconst RX=a=>{const c=Math.cos(a),s=Math.sin(a);return[1,0,0, 0,c,s, 0,-s,c]};\nconst RY=a=>{const c=Math.cos(a),s=Math.sin(a);return[c,0,-s, 0,1,0, s,0,c]};\nfunction angle(ms){const k=ms/1000/SECONDS_PER_TURN;return (k-EASE*Math.sin(2*Math.PI*k)/(2*Math.PI))*2*Math.PI}\nconst FIX=new URLSearchParams(location.search).get('t');\nconst tilt=TILT*Math.PI/180;\nfunction frame(ms){\n  if(FIX!==null) ms=+FIX*1000;\n  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);\n  gl.uniformMatrix3fv(U('u_rot'),false,mul(RX(tilt),RY(angle(ms))));\n  gl.drawArrays(gl.TRIANGLES,0,COUNT);\n  requestAnimationFrame(frame);\n}\nrequestAnimationFrame(frame);\n<\/script><\/body><\/ht <script>
			/* hero waves: the ribbon from the Wave thumbnail, held in place and flowing in light grey */
			(function () {
				var cv = document.getElementById('waves');
				if (!cv) return;
				var ctx = cv.getContext('2d');
				var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
				var TOP = [[-60, 300], [110, 262], [250, 236], [390, 292], [520, 232], [640, 130], [760, 138]];
				function top(u) {
					if (u <= TOP[0][0]) return TOP[0][1];
					for (var n = 1; n < TOP.length; n++) {
						if (u <= TOP[n][0]) {
							var f = (u - TOP[n - 1][0]) / (TOP[n][0] - TOP[n - 1][0]);
							return TOP[n - 1][1] + (TOP[n][1] - TOP[n - 1][1]) * ((1 - Math.cos(f * Math.PI)) / 2);
						}
					}
					return TOP[TOP.length - 1][1];
				}
				var W = 0,
					H = 0;
				function size() {
					var d = window.devicePixelRatio || 1;
					W = cv.clientWidth;
					H = cv.clientHeight;
					cv.width = W * d;
					cv.height = H * d;
					ctx.setTransform(d, 0, 0, d, 0, 0);
				}
				function draw(t) {
					ctx.clearRect(0, 0, W, H);
					var ph = t * 0.55,
						sx = W / 720,
						sy = H / 470;
					ctx.lineWidth = 1.2;
					ctx.lineCap = 'round';
					ctx.strokeStyle = '#d9d9dd';
					for (var i = 0; i < 26; i++) {
						ctx.beginPath();
						for (var x = -30; x <= 750; x += 6) {
							var u = x - i * 7;
							var gap = 9 - 3 * Math.min(1, Math.max(0, x / 720));
							var y = top(u) + Math.sin(u / 85 + ph * 1.3) * 9 + i * gap;
							if (x === -30) ctx.moveTo(x * sx, y * sy);
							else ctx.lineTo(x * sx, y * sy);
						}
						ctx.stroke();
					}
				}
				size();
				addEventListener('resize', function () {
					size();
					if (reduce) draw(4);
				});
				if (reduce) return draw(4);
				var t0 = performance.now();
				(function tick(now) {
					draw((now - t0) / 1000);
					requestAnimationFrame(tick);
				})(t0);
			})();
		</script>
